[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efnmr"
version = "0.1.0"
description = "Earth's-field NMR single qubit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mishari Alhussain" }]
dependencies = ["numpy", "scipy", "matplotlib", "pyserial", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
audio = ["sounddevice"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: needs the Arduino + interface"]
addopts = "-m 'not hardware'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
